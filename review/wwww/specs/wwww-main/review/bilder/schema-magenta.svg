<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7d838a"/></marker>
  </defs>
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <!-- 12 Punkte im Kreis, je mit Balken für die Zahl der Handys -->
  <g transform="translate(130 150)">
    <circle r="96" fill="none" stroke="#2b3038" stroke-width="2"/>
    <g fill="#e8b04a">
      <circle cx="0" cy="-96" r="5"/><circle cx="48" cy="-83" r="5"/><circle cx="83" cy="-48" r="5"/><circle cx="96" cy="0" r="5"/>
      <circle cx="83" cy="48" r="5"/><circle cx="48" cy="83" r="5"/><circle cx="0" cy="96" r="5"/><circle cx="-48" cy="83" r="5"/>
      <circle cx="-83" cy="48" r="5"/><circle cx="-96" cy="0" r="5"/><circle cx="-83" cy="-48" r="5"/><circle cx="-48" cy="-83" r="5"/>
    </g>
    <!-- Balken: Handys an diesem Punkt, nach innen -->
    <g stroke="#78c8ff" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-86" x2="0" y2="-50"/><line x1="43" y1="-74" x2="35" y2="-60"/><line x1="74" y1="-43" x2="40" y2="-23"/>
      <line x1="86" y1="0" x2="76" y2="0"/><line x1="74" y1="43" x2="52" y2="30"/><line x1="43" y1="74" x2="38" y2="65"/>
      <line x1="0" y1="86" x2="0" y2="40"/><line x1="-43" y1="74" x2="-30" y2="52"/><line x1="-74" y1="43" x2="-66" y2="38"/>
      <line x1="-86" y1="0" x2="-60" y2="0"/><line x1="-74" y1="-43" x2="-70" y2="-40"/><line x1="-43" y1="-74" x2="-25" y2="-43"/>
    </g>
    <text x="0" y="4" fill="#e8e8e8" font-size="11" text-anchor="middle">12 Punkte</text>
  </g>
  <text x="20" y="284" fill="#78c8ff" font-size="11">Balken: wie viele Handys an einem Punkt stehen</text>
  <path d="M240 150 L300 150" stroke="#7d838a" stroke-width="1.5" marker-end="url(#p)"/>
  <!-- Stilvorgaben gewichtet -->
  <g>
    <rect x="306" y="96" width="100" height="108" rx="6" fill="#22262d" stroke="#7d838a"/>
    <text x="316" y="116" fill="#e8e8e8" font-size="11">Stilvorgaben,</text><text x="316" y="130" fill="#e8e8e8" font-size="11">gewichtet</text>
    <rect x="316" y="142" width="70" height="8" fill="#78c8ff"/><rect x="316" y="156" width="40" height="8" fill="#78c8ff" opacity="0.7"/>
    <rect x="316" y="170" width="56" height="8" fill="#78c8ff" opacity="0.85"/><rect x="316" y="184" width="20" height="8" fill="#78c8ff" opacity="0.5"/>
  </g>
  <path d="M410 150 L438 150" stroke="#7d838a" stroke-width="1.5" marker-end="url(#p)"/>
  <!-- RT2 auf dem Mac mini, ein Musikstrom -->
  <rect x="442" y="126" width="80" height="48" rx="8" fill="#7d838a"/>
  <text x="482" y="148" fill="#15171c" font-size="11" text-anchor="middle" font-weight="600">RT2 Small</text>
  <text x="482" y="163" fill="#15171c" font-size="10" text-anchor="middle">Mac mini, live</text>
  <path d="M528 150 Q534 138 540 150 T552 150 T564 150 T576 150" fill="none" stroke="#78c8ff" stroke-width="2"/>
  <text x="442" y="200" fill="#a0a8b0" font-size="11">Max moduliert</text><text x="442" y="214" fill="#a0a8b0" font-size="11">die Stilstärke</text>
</svg>
