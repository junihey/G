<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="12">
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <!-- Mitte: das W als Netz aus Dreiecken -->
  <g fill="#78c8ff" fill-opacity="0.25" stroke="#78c8ff" stroke-width="1.2">
    <polygon points="230,80 250,80 270,200"/><polygon points="250,80 285,200 270,200"/>
    <polygon points="270,200 285,200 300,130"/><polygon points="300,130 315,200 330,200"/>
    <polygon points="300,130 285,200 315,200" fill-opacity="0.1"/>
    <polygon points="315,200 330,200 370,80"/><polygon points="330,200 350,80 370,80"/>
  </g>
  <text x="300" y="232" fill="#e8e8e8" text-anchor="middle">ein Buchstabe als Netz</text>
  <!-- links: Dekonstruktion, Dreiecke fliegen auseinander -->
  <g fill="#78c8ff" fill-opacity="0.25" stroke="#78c8ff" stroke-width="1.2">
    <polygon points="40,70 60,66 74,120" transform="rotate(-20 60 90)"/>
    <polygon points="90,110 120,190 106,192" transform="rotate(15 105 150)"/>
    <polygon points="140,170 152,170 162,120" transform="rotate(-35 150 150)"/>
    <polygon points="60,200 72,250 86,250" transform="rotate(40 72 225)"/>
    <polygon points="160,60 176,60 190,30" transform="rotate(10 175 50)"/>
  </g>
  <g stroke="#e8b04a" stroke-width="1" stroke-dasharray="2 3"><line x1="220" y1="120" x2="180" y2="100"/><line x1="230" y1="170" x2="160" y2="160"/></g>
  <text x="30" y="282" fill="#e8e8e8" font-size="11">Dekonstruktion: zerlegt das Netz</text>
  <!-- rechts: Struktur, sichtbar umgebaut -->
  <g fill="none" stroke="#e8b04a" stroke-width="1.2">
    <polyline points="420,80 450,200 480,120 510,200 540,80"/>
    <line x1="420" y1="80" x2="480" y2="120"/><line x1="540" y1="80" x2="480" y2="120"/><line x1="450" y1="200" x2="510" y2="200"/>
    <line x1="435" y1="140" x2="525" y2="140"/>
  </g>
  <g fill="#e8b04a"><circle cx="420" cy="80" r="3"/><circle cx="450" cy="200" r="3"/><circle cx="480" cy="120" r="3"/><circle cx="510" cy="200" r="3"/><circle cx="540" cy="80" r="3"/><circle cx="435" cy="140" r="2.5"/><circle cx="525" cy="140" r="2.5"/></g>
  <text x="400" y="282" fill="#e8e8e8" font-size="11">Struktur: baut es sichtbar um</text>
  <!-- ein Ort, eine Animation -->
  <path d="M300 30 C290 30 284 38 284 46 C284 58 300 72 300 72 C300 72 316 58 316 46 C316 38 310 30 300 30 Z" fill="#d9534f"/>
  <circle cx="300" cy="45" r="5" fill="#15171c"/>
  <text x="324" y="44" fill="#d9534f" font-size="11">eine Animation für einen Ort,</text>
  <text x="324" y="58" fill="#d9534f" font-size="11">nie eine ganze Serie</text>
  <text x="300" y="258" fill="#a0a8b0" font-size="11" text-anchor="middle">31 Animationen in vier Dateien, bisher nur der Quelltext gelesen</text>
</svg>
