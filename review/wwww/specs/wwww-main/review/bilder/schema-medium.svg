<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7d838a"/></marker>
  </defs>
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <!-- Prompt vom Besucher -->
  <rect x="20" y="30" width="16" height="28" rx="4" fill="none" stroke="#7d838a" stroke-width="2"/>
  <text x="44" y="50" fill="#e8e8e8" font-size="11">Prompt eines Besuchers</text>
  <!-- zwei Wege: ohne und mit Qwen -->
  <rect x="20" y="78" width="120" height="26" rx="5" fill="#22262d" stroke="#e8b04a"/>
  <text x="30" y="95" fill="#e8b04a">„jazz“</text>
  <rect x="20" y="168" width="240" height="70" rx="5" fill="#22262d" stroke="#e8b04a"/>
  <text x="30" y="186" fill="#e8b04a" font-size="11">„smoky late-night jazz trio, brushed</text>
  <text x="30" y="200" fill="#e8b04a" font-size="11">drums, upright bass walking slowly,</text>
  <text x="30" y="214" fill="#e8b04a" font-size="11">muted trumpet, warm room …“</text>
  <text x="30" y="230" fill="#a0a8b0" font-size="10">Beispiel, nicht aus der Ausgabe</text>
  <path d="M80 106 L80 160" stroke="#7d838a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#p)"/>
  <text x="88" y="138" fill="#a0a8b0" font-size="11">Qwen verlängert</text>
  <!-- Max → ComfyUI → SA3 Medium -->
  <path d="M144 91 L300 130" stroke="#7d838a" stroke-width="1.5" marker-end="url(#p)"/>
  <path d="M264 200 L300 160" stroke="#7d838a" stroke-width="1.5" marker-end="url(#p)"/>
  <rect x="304" y="122" width="150" height="46" rx="8" fill="#7d838a"/>
  <text x="379" y="141" fill="#15171c" font-size="11" text-anchor="middle" font-weight="600">SA3 Medium</text>
  <text x="379" y="157" fill="#15171c" font-size="10" text-anchor="middle">aus Max über ComfyUI</text>
  <!-- zwei Klänge -->
  <path d="M458 136 L480 100" stroke="#7d838a" stroke-width="1.5" marker-end="url(#p)"/>
  <path d="M458 156 L480 196" stroke="#7d838a" stroke-width="1.5" marker-end="url(#p)"/>
  <path d="M486 92 l4 -10 l4 18 l4 -14 l4 10 l4 -12 l4 16 l4 -10 l4 8 l4 -12 l4 14 l4 -8 l4 6 l4 -4 l4 2 l4 -1" fill="none" stroke="#78c8ff" stroke-width="1.5"/>
  <text x="486" y="122" fill="#a0a8b0" font-size="11">ohne Qwen</text>
  <path d="M486 204 l3 -8 l3 14 l3 -18 l3 20 l3 -14 l3 10 l3 -16 l3 18 l3 -12 l3 8 l3 -14 l3 16 l3 -10 l3 12 l3 -16 l3 14 l3 -8 l3 10 l3 -12 l3 8 l3 -6 l3 4 l3 -2" fill="none" stroke="#78c8ff" stroke-width="1.5"/>
  <text x="486" y="232" fill="#a0a8b0" font-size="11">mit Qwen</text>
  <text x="304" y="282" fill="#e8e8e8" font-size="11">Erkennt man den Text im Klang wieder?</text>
</svg>
