<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <radialGradient id="feldA"><stop offset="0" stop-color="#78c8ff" stop-opacity="0.55"/><stop offset="0.33" stop-color="#78c8ff" stop-opacity="0.35"/><stop offset="1" stop-color="#78c8ff" stop-opacity="0.08"/></radialGradient>
    <radialGradient id="feldB"><stop offset="0" stop-color="#78c8ff" stop-opacity="0.8"/><stop offset="0.33" stop-color="#78c8ff" stop-opacity="0.55"/><stop offset="1" stop-color="#78c8ff" stop-opacity="0.15"/></radialGradient>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8e8e8"/></marker>
  </defs>
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <!-- Das Handy mit XY-Feld -->
  <rect x="30" y="24" width="136" height="252" rx="18" fill="#22262d" stroke="#7d838a" stroke-width="2"/>
  <rect x="40" y="44" width="116" height="212" rx="6" fill="#2b3038"/>
  <line x1="98" y1="54" x2="98" y2="246" stroke="#7d838a" stroke-dasharray="3 4"/>
  <line x1="48" y1="150" x2="148" y2="150" stroke="#7d838a" stroke-dasharray="3 4"/>
  <g fill="#e8e8e8" font-size="10" text-anchor="middle">
    <text x="98" y="62">hoch</text><text x="98" y="244">runter</text><text x="56" y="146">links</text><text x="140" y="146">rechts</text>
  </g>
  <!-- ein Finger: Flug -->
  <circle cx="110" cy="118" r="10" fill="none" stroke="#e8b04a" stroke-width="2.5"/>
  <text x="98" y="160" fill="#e8b04a" font-size="10" text-anchor="middle">Mitte = vor</text>
  <!-- zwei Finger: Pinch = Hörweite -->
  <circle cx="72" cy="210" r="8" fill="none" stroke="#78c8ff" stroke-width="2.5"/><circle cx="124" cy="210" r="8" fill="none" stroke="#78c8ff" stroke-width="2.5"/>
  <path d="M82 210 L114 210" stroke="#78c8ff" stroke-width="1.5" marker-start="url(#pfeil)" marker-end="url(#pfeil)"/>
  <!-- Legende links -->
  <g font-size="11">
    <text x="176" y="122" fill="#e8b04a">ein Finger hält:</text><text x="176" y="136" fill="#e8b04a">Flug</text>
    <text x="176" y="206" fill="#78c8ff">zwei Finger:</text><text x="176" y="220" fill="#78c8ff">Klang formen,</text><text x="176" y="234" fill="#78c8ff">Pinch = Hörweite</text>
    <text x="176" y="44" fill="#e8e8e8">Handy drehen:</text><text x="176" y="58" fill="#e8e8e8">Blick (Gyroskop)</text>
  </g>
  <path d="M150 30 A26 26 0 0 1 172 52" fill="none" stroke="#e8e8e8" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- Rechts: der Besucher in den Feldern -->
  <line x1="290" y1="16" x2="290" y2="284" stroke="#2b3038"/>
  <circle cx="390" cy="150" r="90" fill="url(#feldA)"/>
  <circle cx="500" cy="140" r="78" fill="url(#feldB)"/>
  <circle cx="390" cy="150" r="30" fill="none" stroke="#78c8ff" stroke-opacity="0.5" stroke-dasharray="2 3"/>
  <circle cx="500" cy="140" r="26" fill="none" stroke="#78c8ff" stroke-opacity="0.7" stroke-dasharray="2 3"/>
  <circle cx="390" cy="150" r="3" fill="#e8e8e8"/><circle cx="500" cy="140" r="3" fill="#e8e8e8"/>
  <!-- Besucher in der Überlappung, Blick auf B -->
  <circle cx="448" cy="152" r="7" fill="#e8b04a"/>
  <path d="M455 150 L486 143" stroke="#e8b04a" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- Echolot -->
  <path d="M444 146 L340 52" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="1 4"/>
  <circle cx="340" cy="52" r="3" fill="#e8e8e8"/>
  <g fill="#e8e8e8" font-size="11">
    <text x="320" y="268">Feld A: hörbar, weil man drin ist</text>
    <text x="470" y="232">Feld B: angeschaut,</text><text x="470" y="246">deshalb präsenter</text>
    <text x="358" y="154" font-size="10">Kern</text>
    <text x="304" y="40">wischen: Echolot</text>
    <text x="300" y="110" font-size="10" fill="#a0a8b0">außerhalb:</text><text x="300" y="122" font-size="10" fill="#a0a8b0">Zwischenraum-</text><text x="300" y="134" font-size="10" fill="#a0a8b0">Preset</text>
  </g>
</svg>
