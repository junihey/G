<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <pattern id="schraffur" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><line x1="0" y1="0" x2="0" y2="5" stroke="#e8e8e8" stroke-width="0.8"/></pattern>
    <pattern id="schraffur2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-50)"><line x1="0" y1="0" x2="0" y2="4" stroke="#e8e8e8" stroke-width="0.5"/></pattern>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#78c8ff"/></marker>
    <clipPath id="bild"><rect x="110" y="16" width="380" height="268" rx="6"/></clipPath>
  </defs>
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <!-- links und rechts die Vorschau: schwarzer und weißer Raum mit Scans -->
  <rect x="16" y="60" width="84" height="180" rx="4" fill="#050505" stroke="#2b3038"/>
  <g fill="#7d838a"><rect x="30" y="110" width="22" height="16"/><rect x="62" y="132" width="22" height="16"/><rect x="34" y="170" width="18" height="14"/></g>
  <g stroke="#e8e8e8" stroke-width="0.8"><line x1="41" y1="128" x2="41" y2="140"/><line x1="73" y1="150" x2="73" y2="160"/></g>
  <rect x="500" y="60" width="84" height="180" rx="4" fill="#f2f2f2" stroke="#2b3038"/>
  <g fill="#7d838a"><rect x="514" y="104" width="22" height="16"/><rect x="546" y="136" width="22" height="16"/><rect x="520" y="176" width="18" height="14"/></g>
  <g stroke="#15171c" stroke-width="0.8"><line x1="525" y1="122" x2="525" y2="134"/><line x1="557" y1="154" x2="557" y2="164"/></g>
  <text x="18" y="52" fill="#e8e8e8" font-size="11">schwarzer Raum</text>
  <text x="510" y="52" fill="#e8e8e8" font-size="11">weißer Raum</text>
  <!-- die Fläche: Ringe gehen über den Bildrand hinaus -->
  <g clip-path="url(#bild)">
    <rect x="110" y="16" width="380" height="268" fill="#0e0e10"/>
    <circle cx="300" cy="150" r="260" fill="url(#schraffur)" opacity="0.35"/>
    <circle cx="300" cy="150" r="200" fill="#0e0e10"/>
    <circle cx="300" cy="150" r="200" fill="url(#schraffur2)" opacity="0.55"/>
    <circle cx="300" cy="150" r="150" fill="#0e0e10"/>
    <circle cx="300" cy="150" r="150" fill="url(#schraffur)" opacity="0.7"/>
    <circle cx="300" cy="150" r="80" fill="#0e0e10"/>
  </g>
  <rect x="110" y="16" width="380" height="268" rx="6" fill="none" stroke="#2b3038"/>
  <!-- drei Symbole -->
  <g fill="none" stroke="#e8e8e8" stroke-width="2.4" stroke-linecap="round">
    <ellipse cx="262" cy="150" rx="15" ry="22" transform="rotate(-8 262 150)"/><path d="M262 136 l-6 9 h8 z M263 138 L263 172"/>
    <path d="M292 132 h16 M292 132 v36 h17 M292 150 h12"/>
    <path d="M324 142 q8 -10 16 -2 q8 -8 14 2 q-6 8 -14 6 q-8 6 -16 -6 z M326 156 q8 -6 14 2 q10 -6 14 4 q-8 6 -14 2 q-8 4 -14 -8"/>
  </g>
  <!-- Gesten -->
  <g stroke="#78c8ff" stroke-width="2" fill="none" marker-end="url(#p)">
    <path d="M240 150 L120 150"/><path d="M362 150 L482 150"/>
    <path d="M300 126 L300 40"/><path d="M300 174 L300 262"/>
  </g>
  <g fill="#78c8ff" font-size="11">
    <text x="128" y="142">wischen: Vorschau</text>
    <text x="392" y="142">wischen: Vorschau</text>
    <text x="306" y="56">nach Tipp auf E: Gedichte</text>
    <text x="306" y="256">nach Tipp auf E: Kontakt · Buchung · Vita</text>
  </g>
  <g fill="#e8e8e8" font-size="10" text-anchor="middle"><text x="262" y="188">O → /wwww/</text><text x="339" y="188">Wurst → Discord</text></g>
  <text x="482" y="294" fill="#a0a8b0" font-size="10" text-anchor="end">Impressum fest in der Ecke</text>
</svg>
