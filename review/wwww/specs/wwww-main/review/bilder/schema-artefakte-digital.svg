  <text x="30" y="252" fill="#e8b04a" font-size="11">Takt senken, Bits schalten: die Welle wird zur Treppe</text>
  <!-- Spektrum mit Faltung -->
  <line x1="320" y1="220" x2="580" y2="220" stroke="#7d838a"/>
  <line x1="470" y1="60" x2="470" y2="226" stroke="#d9534f" stroke-dasharray="4 3"/>
