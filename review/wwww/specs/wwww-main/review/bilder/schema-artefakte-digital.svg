  <rect x="360" y="120" width="10" height="100" fill="#78c8ff"/>
  <rect x="520" y="150" width="10" height="70" fill="#78c8ff" opacity="0.35" stroke="#78c8ff" stroke-dasharray="3 2"/>
  <rect x="410" y="150" width="10" height="70" fill="#e8b04a"/>
  <path d="M525 146 C510 96 430 96 415 146" fill="none" stroke="#e8b04a" stroke-width="1.5"/>
  <path d="M415 146 l-3 -9 l8 2 z" fill="#e8b04a"/>
  <text x="330" y="244" fill="#a0a8b0" font-size="11">Ton</text>
  <text x="400" y="244" fill="#e8b04a" font-size="11">Spiegelton</text>
  <text x="500" y="244" fill="#a0a8b0" font-size="11">zu hoch</text>
  <text x="320" y="276" fill="#e8e8e8" font-size="11">Aliasing: was zu hoch ist, faltet zurück</text>
  <text x="30" y="276" fill="#a0a8b0" font-size="11">jeder Eingriff hat einen Regler, ein Ende klingt sauber</text>
