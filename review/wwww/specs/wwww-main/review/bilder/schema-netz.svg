<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <pattern id="fft" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#e8b04a" opacity="0.35"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#e8e8e8" stroke-width="2"/>
    </pattern>
    <clipPath id="f1"><circle cx="100" cy="170" r="64"/></clipPath>
    <clipPath id="f3"><circle cx="312" cy="170" r="64"/></clipPath>
  </defs>
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <!-- Draufsicht: drei Felder, Loris und RAVE im Wechsel -->
  <rect x="16" y="16" width="380" height="268" rx="6" fill="#20242b"/>
  <text x="28" y="38" fill="#9aa0a6" font-size="11">Zwischenraum-Preset</text>
  <!-- freier Rand: FFT-Effekt nur an der Seite ohne Nachbarn -->
  <path d="M100 98 A72 72 0 0 0 100 242" fill="none" stroke="url(#fft)" stroke-width="12"/>
  <path d="M312 98 A72 72 0 0 1 312 242" fill="none" stroke="url(#fft)" stroke-width="12"/>
  <!-- Felder -->
  <circle cx="100" cy="170" r="64" fill="#5cb85c" opacity="0.45"/>
  <circle cx="206" cy="170" r="64" fill="#b05cc8" opacity="0.45"/>
  <circle cx="312" cy="170" r="64" fill="#5cb85c" opacity="0.45"/>
  <!-- Überlappen: FFT-Verbinder -->
  <circle cx="206" cy="170" r="64" fill="url(#fft)" clip-path="url(#f1)"/>
  <circle cx="206" cy="170" r="64" fill="url(#fft)" clip-path="url(#f3)"/>
  <g fill="#e8e8e8" font-size="12" text-anchor="middle">
    <text x="84" y="174">Loris</text>
    <text x="206" y="166">RAVE</text>
    <text x="206" y="182" font-size="10" fill="#c8c8c8">oder beide</text>
    <text x="328" y="174">Loris</text>
  </g>
  <!-- Flugrichtung wählt den Verbinder -->
  <g font-size="11" fill="#e8b04a" text-anchor="middle">
    <text x="153" y="258">AND →</text>
    <text x="153" y="272">← XOR</text>
    <text x="259" y="258">← AND</text>
    <text x="259" y="272">XOR →</text>
  </g>
  <!-- Schnatz mit Körnern, unbearbeitet -->
  <circle cx="206" cy="46" r="9" fill="#e8e8e8"/>
  <g fill="#e8e8e8" opacity="0.7">
    <circle cx="188" cy="36" r="2"/><circle cx="182" cy="50" r="1.5"/><circle cx="224" cy="34" r="2"/>
    <circle cx="228" cy="54" r="1.5"/><circle cx="196" cy="62" r="1.5"/><circle cx="216" cy="66" r="2"/>
  </g>
  <text x="206" y="88" fill="#e8e8e8" font-size="11" text-anchor="middle">Schnatz, unbearbeitet</text>
  <!-- Legende rechts -->
  <text x="420" y="30" fill="#e8e8e8" font-weight="600">Was rechnet</text>
  <g font-size="12" fill="#e8e8e8">
    <circle cx="430" cy="62" r="8" fill="#e8e8e8"/><text x="446" y="66">Samples als Körner</text>
    <circle cx="430" cy="96" r="9" fill="#5cb85c" opacity="0.6"/><text x="446" y="100">Loris, Teiltöne</text>
    <circle cx="430" cy="130" r="9" fill="#b05cc8" opacity="0.6"/><text x="446" y="134">RAVE, nie neben RAVE</text>
    <rect x="421" y="156" width="18" height="18" fill="url(#fft)"/><text x="446" y="164">FFT: Verbinder im</text>
    <text x="446" y="179">Überlappen, Effekt am</text>
    <text x="446" y="194">freien Rand</text>
    <text x="420" y="232" fill="#9aa0a6" font-size="11">höchstens zugleich:</text>
    <text x="420" y="248" fill="#9aa0a6" font-size="11">2 Felder · 1 RAVE · 1 FFT</text>
  </g>
</svg>
