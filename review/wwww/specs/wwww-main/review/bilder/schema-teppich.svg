<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7d838a"/></marker>
    <linearGradient id="sink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78c8ff" stop-opacity="0.9"/><stop offset="1" stop-color="#78c8ff" stop-opacity="0.1"/></linearGradient>
  </defs>
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <!-- Quellen: Handys über Modelle, Raummikrofon -->
  <rect x="20" y="26" width="18" height="30" rx="4" fill="none" stroke="#7d838a" stroke-width="2"/>
  <rect x="44" y="26" width="18" height="30" rx="4" fill="none" stroke="#7d838a" stroke-width="2"/>
  <text x="20" y="72" fill="#e8e8e8" font-size="11">Handys</text>
  <path d="M68 40 L104 40" stroke="#7d838a" stroke-width="1.5" marker-end="url(#p)"/>
  <rect x="108" y="24" width="122" height="32" rx="5" fill="#22262d" stroke="#7d838a"/>
  <text x="116" y="44" fill="#e8e8e8" font-size="11">RT2 · AFTER · SA3</text>
  <rect x="20" y="96" width="14" height="22" rx="7" fill="none" stroke="#e8b04a" stroke-width="2"/>
  <text x="40" y="112" fill="#e8b04a" font-size="11">Raummikrofon: Fang</text>
  <!-- Antworten als Echo an einem der drei Lautsprecher -->
  <g fill="#7d838a"><rect x="300" y="24" width="24" height="34" rx="3"/><rect x="410" y="24" width="24" height="34" rx="3"/><rect x="520" y="24" width="24" height="34" rx="3"/></g>
  <g fill="#e8e8e8" font-size="11"><text x="282" y="74">Punkte 1–4</text><text x="392" y="74">Punkte 5–8</text><text x="500" y="74">Punkte 9–12</text></g>
  <path d="M232 40 C280 40 300 90 410 90" fill="none" stroke="#78c8ff" stroke-width="2" marker-end="url(#p)"/>
  <path d="M150 108 C220 108 300 100 412 96" fill="none" stroke="#e8b04a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#p)"/>
  <!-- eine Antwort erklingt einmal, dann versinkt sie -->
  <path d="M396 120 Q406 104 416 120 T436 120 T456 120" fill="none" stroke="#78c8ff" stroke-width="2.5"/>
  <text x="466" y="124" fill="#78c8ff" font-size="11">einmal als Echo 1, 2 oder 3</text>
  <text x="466" y="138" fill="#a0a8b0" font-size="11">die Hörweite wählt</text>
  <rect x="421" y="128" width="10" height="58" fill="url(#sink)"/>
  <text x="436" y="168" fill="#a0a8b0" font-size="11">versinkt</text>
  <!-- der Teppich: viele dichte Linien -->
  <g fill="none" stroke="#78c8ff" stroke-width="1">
    <path d="M20 200 Q80 192 140 200 T260 200 T380 200 T500 200 T580 200" opacity="0.7"/>
    <path d="M20 208 Q90 214 160 208 T300 208 T440 208 T580 208" opacity="0.55"/>
    <path d="M20 216 Q70 210 120 216 T220 216 T320 216 T420 216 T520 216 T580 216" opacity="0.6"/>
    <path d="M20 224 Q100 230 180 224 T340 224 T500 224 T580 224" opacity="0.45"/>
    <path d="M20 232 Q60 226 100 232 T180 232 T260 232 T340 232 T420 232 T500 232 T580 232" opacity="0.5"/>
    <path d="M20 240 Q110 246 200 240 T380 240 T580 240" opacity="0.35"/>
    <path d="M20 248 Q75 242 130 248 T240 248 T350 248 T460 248 T580 248" opacity="0.3"/>
    <path d="M20 256 Q95 262 170 256 T320 256 T470 256 T580 256" opacity="0.22"/>
  </g>
  <text x="20" y="282" fill="#e8e8e8">der Teppich: kein eigener Rauschgenerator, nur Verschlucktes</text>
</svg>
