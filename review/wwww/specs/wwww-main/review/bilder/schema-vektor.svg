<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="12">
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <!-- Fenster figur: eine Figur aus Punkten, Linien, Flächen -->
  <rect x="16" y="16" width="330" height="268" rx="6" fill="#1d2127"/>
  <text x="28" y="38" fill="#e8e8e8">figur</text>
  <polygon points="90,200 150,110 210,190" fill="#78c8ff" opacity="0.25"/>
  <g stroke="#78c8ff" stroke-width="2" fill="none"><path d="M90 200 L150 110 L210 190 Z"/><path d="M150 110 L170 60"/></g>
  <g fill="#e8e8e8"><circle cx="90" cy="200" r="4"/><circle cx="150" cy="110" r="4"/><circle cx="210" cy="190" r="4"/><circle cx="170" cy="60" r="4"/></g>
  <!-- Bewegung legt sich darüber -->
  <path d="M60 240 C120 270 240 250 300 170 S320 80 260 60" fill="none" stroke="#e8b04a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="250" y="270" fill="#e8b04a" font-size="11">Bewegung</text>
  <!-- Anker mit Kopien von Formen -->
  <g fill="none" stroke="#e8b04a" stroke-width="1.5">
    <rect x="292" y="160" width="16" height="16" transform="rotate(20 300 168)"/><rect x="300" y="110" width="12" height="12" transform="rotate(40 306 116)"/><rect x="262" y="54" width="10" height="10" transform="rotate(60 267 59)"/>
  </g>
  <g fill="#e8b04a"><circle cx="300" cy="168" r="2.5"/><circle cx="306" cy="116" r="2.5"/><circle cx="267" cy="59" r="2.5"/></g>
  <text x="322" y="132" fill="#e8b04a" font-size="10">Anker</text>
  <!-- Fenster look: Blende zwischen Bild A und B -->
  <rect x="362" y="16" width="222" height="268" rx="6" fill="#1d2127"/>
  <text x="374" y="38" fill="#e8e8e8">look</text>
  <rect x="378" y="56" width="190" height="130" fill="#3f6b38"/>
  <rect x="473" y="56" width="95" height="130" fill="#8a6a4a"/>
  <path d="M378 140 L420 110 L460 130 L473 120" fill="none" stroke="#c8d8c0" stroke-width="3"/>
  <g stroke="#3a2a1a" stroke-width="3"><line x1="490" y1="70" x2="490" y2="180"/><line x1="520" y1="70" x2="520" y2="180"/><line x1="550" y1="70" x2="550" y2="180"/><line x1="473" y1="100" x2="568" y2="100"/></g>
  <line x1="473" y1="52" x2="473" y2="190" stroke="#e8e8e8" stroke-width="2"/>
  <text x="384" y="204" fill="#a0a8b0" font-size="11">Bild A: Wald</text><text x="486" y="204" fill="#a0a8b0" font-size="11">Bild B: Geländer</text>
  <line x1="384" y1="236" x2="562" y2="236" stroke="#7d838a" stroke-width="3"/><circle cx="473" cy="236" r="7" fill="#e8b04a"/>
  <text x="384" y="262" fill="#e8e8e8" font-size="11">blendet zwischen A und B, hier halb</text>
</svg>
