<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="12">
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <!-- Körper vorher: ein Würfel -->
  <g fill="none" stroke="#7d838a" stroke-width="1.5" opacity="0.6">
    <rect x="70" y="110" width="90" height="90"/><rect x="100" y="80" width="90" height="90"/>
    <line x1="70" y1="110" x2="100" y2="80"/><line x1="160" y1="110" x2="190" y2="80"/><line x1="160" y1="200" x2="190" y2="170"/><line x1="70" y1="200" x2="100" y2="170"/>
  </g>
  <text x="70" y="232" fill="#a0a8b0" font-size="11">vorher</text>
  <!-- projektive Verwandlung -->
  <path d="M210 150 C240 130 270 130 300 150" fill="none" stroke="#e8e8e8" stroke-width="1.5"/><path d="M300 150 l-9 -2 l5 -7 z" fill="#e8e8e8"/>
  <text x="214" y="126" fill="#e8e8e8" font-size="11">projektiv</text>
  <!-- Körper nachher: verzerrt -->
  <g fill="none" stroke="#78c8ff" stroke-width="2">
    <polygon points="330,120 440,100 450,210 340,190"/><polygon points="370,70 480,64 490,170 380,160"/>
    <line x1="330" y1="120" x2="370" y2="70"/><line x1="440" y1="100" x2="480" y2="64"/><line x1="450" y1="210" x2="490" y2="170"/><line x1="340" y1="190" x2="380" y2="160"/>
  </g>
  <!-- Funken: Wegkurven aus Ecken und Kanten -->
  <g fill="none" stroke="#e8b04a" stroke-width="1.3" stroke-linecap="round">
    <path d="M480 64 C500 40 530 36 550 50"/><path d="M480 64 C490 36 470 22 456 26"/><path d="M480 64 C510 60 540 74 560 96"/>
    <path d="M490 170 C520 176 540 200 548 226"/><path d="M490 170 C514 160 540 160 566 170"/>
    <path d="M330 120 C306 104 296 82 300 60"/><path d="M330 120 C300 124 280 140 276 166"/>
    <path d="M450 210 C452 236 470 256 496 262"/><path d="M340 190 C320 210 318 236 330 258"/>
    <path d="M410 82 C412 56 430 40 452 36"/>
  </g>
  <g fill="#e8b04a"><circle cx="550" cy="50" r="2.5"/><circle cx="456" cy="26" r="2"/><circle cx="560" cy="96" r="2.5"/><circle cx="548" cy="226" r="2"/><circle cx="566" cy="170" r="2.5"/><circle cx="300" cy="60" r="2"/><circle cx="276" cy="166" r="2.5"/><circle cx="496" cy="262" r="2"/><circle cx="330" cy="258" r="2.5"/><circle cx="452" cy="36" r="2"/></g>
  <text x="20" y="40" fill="#e8e8e8">Ein Körper verwandelt sich projektiv,</text>
  <text x="20" y="56" fill="#e8b04a">aus Ecken und Kanten sprühen Wegkurven als Funken</text>
</svg>
