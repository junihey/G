<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7d838a"/></marker>
  </defs>
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <!-- die Seite als Schichten, oben die Werkzeuge, unten die Szene -->
  <rect x="80" y="30" width="230" height="64" rx="6" fill="#15171c" stroke="#78c8ff"/>
  <text x="92" y="52" fill="#78c8ff" font-weight="600">WebMCP-Werkzeuge</text>
  <text x="92" y="70" fill="#a0a8b0" font-size="11">jede Taste ein Werkzeug,</text>
  <text x="92" y="84" fill="#a0a8b0" font-size="11">jede Antwort eine Ansage</text>
  <rect x="60" y="110" width="230" height="70" rx="6" fill="#22262d" stroke="#e8e8e8"/>
  <text x="72" y="132" fill="#e8e8e8" font-weight="600">HTML ohne three.js</text>
  <text x="72" y="150" fill="#a0a8b0" font-size="11">Werkseiten, Galerie-Schild,</text>
  <text x="72" y="164" fill="#a0a8b0" font-size="11">Knöpfe, Regler, Ansagen</text>
  <rect x="40" y="196" width="230" height="56" rx="6" fill="#2b3038" stroke="#7d838a"/>
  <text x="52" y="218" fill="#e8e8e8" font-weight="600">Canvas: die Szene</text>
  <text x="52" y="236" fill="#a0a8b0" font-size="11">für einen Agenten eine Wand</text>
  <!-- drei Leser -->
  <g fill="#7d838a">
    <rect x="420" y="40" width="150" height="40" rx="6"/><rect x="420" y="130" width="150" height="40" rx="6"/><rect x="420" y="220" width="150" height="40" rx="6"/>
  </g>
  <g fill="#15171c" font-weight="600" text-anchor="middle"><text x="495" y="65">Agent in Chrome</text><text x="495" y="155">Guide</text><text x="495" y="245">Screenreader</text></g>
  <g stroke="#7d838a" stroke-width="1.5" fill="none" marker-end="url(#p)">
    <path d="M312 60 L416 60"/><path d="M312 74 L416 145"/><path d="M292 150 L416 240"/><path d="M292 136 L416 70"/>
  </g>
  <text x="40" y="282" fill="#a0a8b0" font-size="11">Ein Agent bekommt nichts, was ein Screenreader nicht auch bekommt.</text>
</svg>
