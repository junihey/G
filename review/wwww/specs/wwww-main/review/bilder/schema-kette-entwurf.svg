  <text x="203" y="216" fill="#e8b04a" text-anchor="middle" font-size="11">Erinnerung</text>
  <text x="203" y="231" fill="#a0a8b0" text-anchor="middle" font-size="10">72 € · Token, Plot</text>
  <path d="M150 220 L104 220" stroke="#7d838a" stroke-width="1.5" marker-end="url(#p)"/>
  <!-- Beamerkegel -->
  <path d="M30 220 L96 200 L96 240 Z" fill="#e8b04a" opacity="0.25"/>
