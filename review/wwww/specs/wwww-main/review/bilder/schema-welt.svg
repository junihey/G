<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <linearGradient id="raum" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f2f2f2"/><stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="klar"><stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#9a9a9a" stop-opacity="0.55"/></radialGradient>
    <radialGradient id="kugel" cx="0.35" cy="0.35"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#b8c2cc"/><stop offset="1" stop-color="#4a525a"/></radialGradient>
  </defs>
  <rect width="600" height="300" rx="10" fill="#15171c"/>
  <rect x="16" y="16" width="568" height="268" rx="6" fill="url(#raum)"/>
  <!-- Nebel zwischen den Arbeiten, klare Luft um jede -->
  <g opacity="0.9">
    <circle cx="110" cy="206" r="44" fill="url(#klar)"/><circle cx="230" cy="206" r="44" fill="url(#klar)"/>
    <circle cx="350" cy="206" r="44" fill="url(#klar)"/><circle cx="470" cy="206" r="44" fill="url(#klar)"/>
  </g>
  <!-- Lichtstrahlen vom Lichtpunkt durch die Arbeiten auf die Ebenen -->
  <g stroke="#e8b04a" stroke-width="1" opacity="0.45">
    <line x1="290" y1="250" x2="110" y2="206"/><line x1="110" y1="206" x2="40" y2="160"/>
    <line x1="290" y1="250" x2="470" y2="206"/><line x1="470" y1="206" x2="560" y2="150"/>
    <line x1="290" y1="250" x2="230" y2="206"/><line x1="230" y1="206" x2="200" y2="150"/>
    <line x1="290" y1="250" x2="350" y2="206"/><line x1="350" y1="206" x2="390" y2="150"/>
  </g>
  <!-- Ebenen aus Fäden, gewölbt, mit farbigen Abbildern der Arbeiten -->
  <g fill="none" stroke-dasharray="3 3" stroke-width="2">
    <path d="M30 168 Q290 120 570 168" stroke="#e8b04a"/>
    <path d="M30 112 Q290 70 570 112" stroke="#e8b04a" opacity="0.7"/>
    <path d="M30 60 Q290 24 570 60" stroke="#e8b04a" opacity="0.4"/>
  </g>
  <g stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="160" x2="80" y2="155" stroke="#d9534f"/><line x1="66" y1="160" x2="86" y2="154" stroke="#5cb85c" opacity="0.6"/>
    <line x1="196" y1="146" x2="220" y2="143" stroke="#4aa3df"/><line x1="380" y1="145" x2="404" y2="147" stroke="#e8c14a"/>
    <line x1="520" y1="155" x2="544" y2="160" stroke="#b05cc8"/>
    <line x1="230" y1="94" x2="250" y2="92" stroke="#4aa3df" opacity="0.4"/><line x1="380" y1="93" x2="400" y2="95" stroke="#e8c14a" opacity="0.4"/>
  </g>
  <!-- Arbeiten auf einer Höhe, Lichtpunkt darunter -->
  <g fill="#7d838a"><rect x="94" y="198" width="32" height="18"/><rect x="214" y="198" width="32" height="18"/><rect x="334" y="198" width="32" height="18"/><rect x="454" y="198" width="32" height="18"/></g>
  <circle cx="290" cy="250" r="6" fill="#e8b04a"/>
  <!-- Mikroraum: Portal nah an einer Arbeit -->
  <rect x="128" y="186" width="14" height="24" rx="7" fill="none" stroke="#78c8ff" stroke-width="2"/>
  <!-- ferne Arbeit, zur Blüte gefaltet -->
  <g transform="translate(548 212)" fill="#7d838a" opacity="0.7">
    <ellipse rx="4" ry="11" transform="rotate(0)"/><ellipse rx="4" ry="11" transform="rotate(60)"/><ellipse rx="4" ry="11" transform="rotate(120)"/>
  </g>
  <!-- Kreiselspiegel am Grund, gekippt -->
  <ellipse cx="290" cy="274" rx="70" ry="7" fill="#1d2228" transform="rotate(-3 290 274)"/>
  <!-- Schnatz mit Flugbahn -->
  <path d="M420 120 C460 80 520 100 500 60" fill="none" stroke="#78c8ff" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="420" cy="122" r="8" fill="url(#kugel)"/>
  <!-- Beschriftung -->
  <g fill="#e8e8e8">
    <text x="36" y="40">schwarz oben</text>
    <text x="450" y="48">Schnatz, spiegelt</text>
    <text x="250" y="66" font-size="11">Ebenen aus Fäden</text>
  </g>
  <g fill="#15171c">
    <text x="36" y="148" font-size="11">Abbild der Arbeiten</text>
    <text x="96" y="232">Arbeiten in klarer Luft</text>
    <text x="146" y="184" fill="#2b6f99" font-size="11">Mikroraum</text>
    <text x="500" y="240" font-size="11">fern: Blüte</text>
    <text x="300" y="256" font-size="11">Lichtpunkt</text>
    <text x="370" y="279" font-size="11">Kreiselspiegel</text>
    <text x="36" y="279">weiß unten</text>
  </g>
</svg>
